<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Susatwik Manuri — Engine Room &amp; Technology Stack">
  <title>02 // My Engine Room — Technology Stack</title>
  <desc>Orbital technology radar and production category matrix for Susatwik Manuri.</desc>
  <defs>
    <linearGradient id="stack-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e365d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="orbit-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stack-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#14263d" stroke-width="0.7" opacity="0.3"/>
    </pattern>
    <clipPath id="stack-clip">
      <rect x="1" y="1" width="1198" height="678" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#stack-clip)">
    <!-- Base Card Fill -->
    <rect x="1" y="1" width="1198" height="678" rx="22" fill="#070b16" stroke="url(#stack-border)" stroke-width="1.5"/>
    <rect x="2" y="2" width="1196" height="676" fill="url(#stack-grid)"/>

    <!-- Header Section -->
    <text x="44" y="38" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.6">02 / MY ENGINE ROOM</text>
    <text x="42" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">TOOLS CHANGE. CURIOSITY DOESN’T.</text>
    <text x="44" y="125" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.6">LANGUAGES / SYSTEMS / INTELLIGENCE</text>
    <path d="M 44 142 L 1156 142" stroke="#1a2d47" stroke-width="1"/>

    <!-- ==================== LEFT SIDE: ORBITAL SYSTEM DIAGRAM ==================== -->
    <g transform="translate(44, 160)">
      <rect x="0" y="0" width="500" height="450" rx="16" fill="#091424" stroke="#1d385c" stroke-width="1"/>
      <ellipse cx="250" cy="225" rx="220" ry="180" fill="url(#orbit-halo)"/>

      <!-- Orbital Rings -->
      <ellipse cx="250" cy="225" rx="210" ry="160" fill="none" stroke="#1e3a60" stroke-width="1.2" stroke-dasharray="6 8"/>
      <ellipse cx="250" cy="225" rx="160" ry="115" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.4"/>
      <ellipse cx="250" cy="225" rx="105" ry="70" fill="none" stroke="#00f5a0" stroke-width="1.2" opacity="0.35"/>

      <!-- Central Hexagonal Core: SM (Susatwik Manuri) -->
      <polygon points="250,185 285,205 285,245 250,265 215,245 215,205" fill="#0c1e34" stroke="#00d2ff" stroke-width="2"/>
      <text x="250" y="233" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">SM</text>

      <!-- Orbiting Nodes / Tech Pills -->
      <!-- Node: TypeScript -->
      <g transform="translate(140, 100)">
        <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#0b172a" stroke="#00d2ff" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">TypeScript</text>
      </g>

      <!-- Node: Python -->
      <g transform="translate(360, 100)">
        <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#0b172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Python</text>
      </g>

      <!-- Node: React -->
      <g transform="translate(80, 225)">
        <rect x="-32" y="-14" width="64" height="28" rx="14" fill="#0b172a" stroke="#00d2ff" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">React</text>
      </g>

      <!-- Node: Node.js -->
      <g transform="translate(420, 225)">
        <rect x="-36" y="-14" width="72" height="28" rx="14" fill="#0b172a" stroke="#00f5a0" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">Node.js</text>
      </g>

      <!-- Node: PostgreSQL -->
      <g transform="translate(150, 345)">
        <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#0b172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">PostgreSQL</text>
      </g>

      <!-- Node: GenAI / RAG -->
      <g transform="translate(350, 345)">
        <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#0b172a" stroke="#c084fc" stroke-width="1.2"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">GenAI · RAG</text>
      </g>

