      <text x="0" y="24" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.6">01 / CORE LANGUAGES</text>
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">PRIMARY</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#00d2ff">TypeScript</text>

        <rect x="195" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">DATA &amp; AI</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#38bdf8">Python</text>

        <rect x="390" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">ALGORITHMS</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#00f5a0">Java · SQL</text>
