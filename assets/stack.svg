<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Susatwik Manuri — Technology Radar">
  <title>Engineering Stack &amp; Technology Radar</title>
  <desc>Multi-tiered radar visualization of Susatwik Manuri's production technology stack across Languages, AI/ML, Backend, Databases, and Cloud surfaces.</desc>
  <defs>
    <linearGradient id="stack-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="stack-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stack-clip">
      <rect x="1" y="1" width="1198" height="518" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#stack-clip)">
    <rect x="1" y="1" width="1198" height="518" rx="20" fill="#070b16" stroke="url(#stack-border)" stroke-width="1.5"/>
    <rect x="2" y="2" width="1196" height="516" fill="url(#stack-center-glow)"/>

    <!-- Header info -->
    <rect x="54" y="24" width="8" height="8" fill="#00d2ff" rx="1.5"/>
    <text x="72" y="32" font-family="ui-monospace, 'SF Mono', monospace" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="2">02 // MULTI-TIERED OPERATIONAL STACK</text>
    <text x="54" y="72" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff">TECHNOLOGY RADAR</text>

    <!-- Radar Coordinate Center at (600, 290) -->
    <g transform="translate(600, 290)">
      <!-- Orbits -->
      <circle cx="0" cy="0" r="200" fill="none" stroke="#193557" stroke-width="1.2" stroke-dasharray="8 6"/>
      <circle cx="0" cy="0" r="145" fill="none" stroke="#1d4575" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="40" fill="#082f49" stroke="#00d2ff" stroke-width="2"/>

      <!-- Core Label -->
      <text x="0" y="-4" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">ALGO</text>
      <text x="0" y="12" font-family="ui-monospace, 'SF Mono', monospace" font-size="9" font-weight="700" fill="#00f5a0" text-anchor="middle">1800+ SOLVED</text>

      <!-- Crosshair Axes -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="#152e4d" stroke-width="1"/>
      <line x1="0" y1="-210" x2="0" y2="210" stroke="#152e4d" stroke-width="1"/>

      <!-- Layer 1: Core Languages (r ~ 90) -->
      <g transform="translate(0, -90)">
        <rect x="-45" y="-12" width="90" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(75, 45)">
        <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(-75, 45)">
        <rect x="-45" y="-12" width="90" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">JavaScript</text>
      </g>

      <!-- Layer 2: Frontend & Backend Execution (r ~ 145) -->
      <g transform="translate(-115, -90)">
        <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#0f172a" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">React 18</text>
      </g>
      <g transform="translate(115, -90)">
        <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#0f172a" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(145, 10)">
        <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#0f172a" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">Next.js</text>
      </g>
      <g transform="translate(-145, 10)">
        <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#0f172a" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">Express</text>
      </g>
      <g transform="translate(0, 145)">
        <rect x="-55" y="-12" width="110" height="24" rx="4" fill="#0f172a" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">MongoDB / SQL</text>
      </g>

      <!-- Layer 3: AI & Cloud Systems (r ~ 200) -->
      <g transform="translate(-170, -115)">
        <rect x="-55" y="-12" width="110" height="24" rx="4" fill="#091322" stroke="#a855f7" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Google GenAI</text>
      </g>
      <g transform="translate(170, -115)">
        <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#091322" stroke="#a855f7" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">OpenAI APIs</text>
      </g>
      <g transform="translate(180, 85)">
        <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#091322" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">RAG Systems</text>
      </g>
      <g transform="translate(-180, 85)">
        <rect x="-45" y="-12" width="90" height="24" rx="4" fill="#091322" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Supabase</text>
      </g>
      <g transform="translate(0, -200)">
        <rect x="-55" y="-12" width="110" height="24" rx="4" fill="#091322" stroke="#00f5a0" stroke-width="1"/>
        <text x="0" y="4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">Vercel / Cloud</text>
      </g>
    </g>

    <!-- Left & Right Legend Labels -->
    <g transform="translate(54, 460)">
      <circle cx="6" cy="0" r="5" fill="#00d2ff"/>
      <text x="18" y="4" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">CORE FOUNDATION</text>
      <circle cx="170" cy="0" r="5" fill="#00f5a0"/>
      <text x="182" y="4" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">FULLSTACK &amp; RUNTIME</text>
      <circle cx="350" cy="0" r="5" fill="#c084fc"/>
      <text x="362" y="4" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">AI &amp; AGENTIC WORKFLOWS</text>
    </g>
    <text x="980" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">RADAR: OPERATIONAL</text>
  </g>
</svg>