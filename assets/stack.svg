      <!-- Row 2: Frontend & Runtime -->
      <text x="0" y="142" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.6">02 / FRONTEND &amp; RUNTIME</text>
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">INTERFACES</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">React 18</text>

        <rect x="195" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">SSR / APP</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#00d2ff">Next.js</text>

        <rect x="390" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">3D GRAPHICS</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#c084fc">Three.js</text>
      </g>

      <!-- Row 3: Backend, Data & AI -->
      <text x="0" y="260" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.6">03 / BACKEND, DATA &amp; AI SYSTEMS</text>
      <g transform="translate(0, 274)">
        <rect x="0" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">APIs &amp; QUEUES</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#00f5a0">Node · FastAPI</text>

        <rect x="195" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">RELATIONAL &amp; DOC</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#38bdf8">Postgres · Mongo</text>

        <rect x="390" y="0" width="175" height="58" rx="8" fill="#0b1626" stroke="#1d385c" stroke-width="1"/>
        <text x="18" y="24" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">INTELLIGENCE</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#c084fc">GenAI · RAG</text>
      </g>

      <!-- Footer Tag -->
      <text x="0" y="380" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.6">ALGORITHMS / ARCHITECTURE / EXECUTION / REPEAT</text>
    </g>

    <!-- Bottom Global Strip -->
    <path d="M 44 635 L 1156 635" stroke="#172c47" stroke-width="1"/>
    <text x="44" y="658" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569" letter-spacing="1.2">SYSTEM SPECIFICATION // 1800+ SOLVED PROBLEMS · 21+ REPOSITORIES · CODECHEF 4★</text>
  </g>
</svg>